// Photo sharing and saving to the gallery, called from C# through the Java bridge in src/ (Infrastructure/Photos).
apply plugin: 'com.android.library'

dependencies {
    implementation 'androidx.core:core:1.13.1'
}

android {
    namespace "com.pavko.hauntscope.share"
    // SDK levels and build tools follow what Unity writes to gradle.properties (and ships in its SDK),
    // so an Editor upgrade needs no edit here.
    compileSdk((project.findProperty('unity.compileSdkVersion') ?: '36').toString().toInteger())
    buildToolsVersion = (project.findProperty('unity.buildToolsVersion') ?: '36.0.0').toString()

    defaultConfig {
        minSdk((project.findProperty('unity.minSdkVersion') ?: '25').toString().toInteger())
        consumerProguardFiles 'proguard-rules.txt'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src/main/java']
            res.srcDirs = ['res']
        }
    }
}
